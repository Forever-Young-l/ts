<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8e9b86">
<title>滕王阁 · 江南方块世界</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
:root{color-scheme:dark;--ink:#17221e;--paper:#f0e5cb;--gold:#d7bd84;--panel:rgba(20,31,27,.72);--line:rgba(238,218,176,.28)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#91a18d;color:var(--paper);font-family:"Noto Serif SC","Songti SC","STSong",serif}
button{font:inherit}
#world{position:fixed;inset:0;background:linear-gradient(#829b9b,#e4bd91 58%,#5c7467)}
.voxel-canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
.topbar{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:20px 26px;pointer-events:none;background:linear-gradient(180deg,rgba(10,20,17,.46),transparent)}
.brand{display:flex;align-items:center;gap:12px;text-shadow:0 2px 12px #14221d}
.brand-mark{width:32px;height:32px;display:grid;place-items:center;border:1px solid rgba(225,197,140,.72);background:rgba(83,48,37,.72);color:#f0d6a1;font-size:17px}
.brand-title{font-size:16px;letter-spacing:.18em;color:#fff1d4}
.brand-sub{margin-top:3px;font:9px/1.2 Arial,sans-serif;letter-spacing:.24em;color:rgba(255,240,213,.76)}
.top-actions{display:flex;align-items:center;gap:8px;pointer-events:auto}
.mode{font-size:11px;letter-spacing:.1em;color:#f5e8ca;padding:8px 12px;background:rgba(17,29,25,.45);border:1px solid var(--line)}
.ui-btn{border:1px solid rgba(237,215,170,.42);background:rgba(20,32,27,.68);color:#f2e5c8;padding:9px 13px;font-size:11px;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(8px);transition:.18s}
.ui-btn:hover,.ui-btn.selected{background:rgba(135,75,49,.88);border-color:#e0bd7e;color:#fff0ce}
.bottom-bar{position:fixed;z-index:3;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:end;padding:28px 28px 22px;background:linear-gradient(0deg,rgba(11,20,17,.58),transparent);pointer-events:none}
.scene-name{font-size:13px;letter-spacing:.16em;color:#fff0d0;text-shadow:0 2px 10px #17211d}
.scene-sub{margin-top:5px;font-size:10px;letter-spacing:.12em;color:rgba(255,239,211,.76)}
.hints{font:11px/1.8 Arial,sans-serif;letter-spacing:.05em;color:rgba(255,245,220,.84);text-align:center;text-shadow:0 2px 8px #17211d}
#coords{font:10px Arial,sans-serif;letter-spacing:.08em;color:rgba(255,245,220,.7);text-align:right}
.reticle{position:fixed;z-index:2;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);pointer-events:none;opacity:.8}
.reticle:before,.reticle:after{content:"";position:absolute;background:rgba(255,247,222,.82);box-shadow:0 1px 3px #25332b}
.reticle:before{left:7px;top:1px;width:2px;height:14px}
.reticle:after{left:1px;top:7px;width:14px;height:2px}
.intro{position:fixed;z-index:5;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,rgba(13,27,24,.32),rgba(13,27,24,.56));transition:opacity .7s}
.intro.hidden{opacity:0;pointer-events:none}
.intro:before,.intro:after{content:"";position:absolute;left:50%;width:1px;height:70px;background:linear-gradient(transparent,rgba(241,216,165,.85),transparent)}
.intro:before{top:13%}.intro:after{bottom:13%}
.intro small{font:10px Arial,sans-serif;letter-spacing:.42em;color:#f0d49b}
.intro h1{font-weight:500;font-size:clamp(46px,7vw,82px);letter-spacing:.24em;margin:22px 0 10px;color:#fff0d2;text-shadow:0 4px 26px rgba(8,17,14,.8)}
.intro p{font-size:13px;letter-spacing:.2em;color:rgba(255,238,207,.88);margin:0 0 34px}
.enter-btn{border:1px solid #e0c18a;background:linear-gradient(135deg,#8e4d35,#5b372b);color:#fff0d1;padding:13px 34px;font-size:13px;letter-spacing:.22em;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.enter-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.toast{position:fixed;z-index:8;left:50%;bottom:82px;transform:translate(-50%,12px);opacity:0;padding:10px 16px;background:rgba(20,31,27,.88);border:1px solid var(--line);color:#f1e3c5;font-size:11px;letter-spacing:.06em;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
#boot-error{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));padding:18px 20px;background:rgba(37,25,22,.96);border:1px solid #d5aa73;color:#fff0d2;font-size:13px;line-height:1.8;text-align:center;box-shadow:0 12px 50px rgba(0,0,0,.4)}
.touch-pad{display:none;position:fixed;z-index:4;left:18px;bottom:76px;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:5px}
.touch-btn{border:1px solid rgba(241,222,184,.4);background:rgba(17,31,26,.46);color:#fff0d2;font:17px Arial,sans-serif;touch-action:none;user-select:none}
.touch-btn.pressed{background:rgba(143,81,53,.85)}
.touch-btn.up{grid-column:2;grid-row:1}.touch-btn.left{grid-column:1;grid-row:2}.touch-btn.down{grid-column:2;grid-row:2}.touch-btn.right{grid-column:3;grid-row:2}
@media(max-width:760px){
 .topbar{padding:12px 12px}.brand-title{font-size:12px}.brand-sub{font-size:8px}.brand-mark{width:28px;height:28px}
 .top-actions{gap:5px}.mode{display:none}.ui-btn{padding:8px 9px;font-size:10px}
 .bottom-bar{padding:18px 14px 14px}.hints{display:none}.scene-name{font-size:11px}#coords{font-size:9px}
 .touch-pad{display:grid}.toast{bottom:138px;max-width:calc(100vw - 30px);white-space:normal;text-align:center}
 .intro p{font-size:11px}.enter-btn{padding:12px 26px}
}
</style>
</head>
<body>
<div id="world"></div>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">阁</div>
    <div><div class="brand-title">滕 王 阁</div><div class="brand-sub">VOXEL JIANGNAN · 1.0</div></div>
  </div>
  <div class="top-actions">
    <span class="mode" id="mode">自由探索</span>
    <button class="ui-btn" id="tour">自动导览</button>
    <button class="ui-btn" id="reset">重置视角</button>
    <button class="ui-btn" id="fullscreen">全屏</button>
  </div>
</header>
<div class="reticle"></div>
<footer class="bottom-bar">
  <div><div class="scene-name">江天一阁 · 方块江南</div><div class="scene-sub">云销雨霁 · 落霞秋水</div></div>
  <div class="hints">W A S D 移动　·　鼠标环顾　·　Shift 奔跑　·　Space 跳跃</div>
  <div id="coords">位置 0 / 38</div>
</footer>
<div class="touch-pad" aria-label="移动控制">
  <button class="touch-btn up" data-key="w">↑</button>
  <button class="touch-btn left" data-key="a">←</button>
  <button class="touch-btn down" data-key="s">↓</button>
  <button class="touch-btn right" data-key="d">→</button>
</div>
<div class="intro" id="intro">
  <small>VOXEL WORLD · JIANGNAN</small>
  <h1>滕王阁</h1>
  <p>走进《滕王阁序》的方块江南</p>
  <button class="enter-btn" id="enter">进入世界</button>
</div>
<div class="toast" id="toast"></div>
<div id="boot-error" role="alert" hidden></div>
<script type="module">
try {
  await import('./src/app.js');
} catch (error) {
  console.error('Voxel world failed to start:', error);
  const panel = document.getElementById('boot-error');
  panel.hidden = false;
  panel.textContent = '场景启动失败：' + (error && error.message ? error.message : '资源加载异常') + '。请刷新页面重试。';
}
</script>
</body>
</html>
