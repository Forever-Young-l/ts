<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#201b18">
<title>江天一阁 · 走进《滕王阁序》</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
:root{--paper:#e8d9b8;--paper2:#d5c39b;--gold:#b68b4f;--red:#7b3028}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1c201d;color:var(--paper);font-family:"LXGW WenKai TC","KaiTi","STKaiti","Songti SC",serif}
body{background:radial-gradient(ellipse at 50% 46%,#3b4139 0%,#1c211e 56%,#121614 100%)}
.workbench{height:100%;width:100%;display:flex;align-items:center;justify-content:center;gap:26px;padding:20px}
.side{width:286px;max-width:286px;display:flex;flex-direction:column;gap:16px}
.brand{border-bottom:1px solid rgba(207,177,122,.36);padding:0 0 15px}
.brand .seal{display:inline-flex;width:35px;height:35px;border:1px solid #a74c3b;color:#c46c52;align-items:center;justify-content:center;font-size:18px;margin-right:8px;vertical-align:middle}
.brand .small{font-size:11px;letter-spacing:.22em;color:#c6a875}
.brand h1{font-weight:400;font-size:27px;letter-spacing:.08em;margin:10px 0 4px;color:#f0dfbd}
.brand p{margin:0;color:#b6a17d;font-size:12px;letter-spacing:.08em}
.scroll{position:relative;background:linear-gradient(135deg,#e8d9b8,#d9c69e);color:#3d2b1e;border:1px solid #a98b5d;box-shadow:0 15px 34px #0006;padding:17px}
.scroll:before,.scroll:after{content:"";position:absolute;left:-5px;right:-5px;height:7px;background:#8b6743;border:1px solid #c2a476}
.scroll:before{top:-4px}.scroll:after{bottom:-4px}
.scroll h2{font-weight:400;font-size:18px;margin:0 0 10px;color:#633b2c}
.scroll p{font-size:13px;line-height:1.8;margin:0;color:#514131}
.verse-card{min-height:116px}.verse-card .verse{font-size:19px;line-height:1.7;color:#4c3025}.verse-card .note{font-size:11px;color:#92764e;margin-top:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ancient-btn{border:1px solid #98734a;background:linear-gradient(#e8d7b1,#cdb68a);color:#3b2a1e;padding:11px 8px;font:15px "LXGW WenKai TC","KaiTi",serif;cursor:pointer;box-shadow:inset 0 1px #f6e9c9,0 3px 0 #755536;transition:.15s}
.ancient-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.ancient-btn.primary{background:linear-gradient(#a34c3b,#6f2d27);color:#f0dfbd;border-color:#c28c64;box-shadow:inset 0 1px #c98b6d,0 3px 0 #48231e}
.ancient-btn.active{outline:2px solid #d5b77d;outline-offset:2px}.ancient-btn.wide{grid-column:1/-1}
.file-row{font-size:12px;color:#c7b28d;line-height:1.7}.file-row input{width:100%;margin-top:6px;color:#d6c49d;font:11px serif}
.hint{font-size:11px;line-height:1.8;color:#9f947a;border-top:1px solid #756447;padding-top:10px}
.frame-wrap{position:relative;height:min(94vh,177.777vw);width:min(52.9vh,52vw);aspect-ratio:9/16;border:1px solid #b18d58;box-shadow:0 0 0 7px #29241d,0 0 0 8px #8c7048,0 24px 80px #0009;overflow:hidden;background:#24383a}
#world{position:absolute;inset:0}.scene-canvas{display:block;width:100%;height:100%}
.frame-vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(12,18,19,.24),transparent 20%,transparent 69%,rgba(10,16,17,.36));box-shadow:inset 0 0 85px rgba(13,17,17,.42)}
.frame-top{position:absolute;top:26px;left:0;right:0;text-align:center;color:rgba(241,220,177,.83);font-size:11px;letter-spacing:.34em;text-shadow:0 2px 10px #000}
.frame-caption{position:absolute;left:25px;right:25px;bottom:78px;text-align:center;text-shadow:0 2px 12px #000,0 0 24px #000}
.frame-caption .chapter{font-size:12px;color:#dfc18a;letter-spacing:.22em;margin-bottom:12px}
.frame-caption .verse{font-size:23px;line-height:1.7;color:#f5e9cc}.frame-caption .note{font-size:12px;color:#d5c39b;margin-top:7px}
.frame-progress{position:absolute;bottom:24px;left:28px;right:28px;height:2px;background:#e5d3a344}.frame-progress span{display:block;width:0;height:100%;background:#d7b67a;box-shadow:0 0 8px #e2c98e}
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(180deg,rgba(13,24,27,.48),rgba(12,20,20,.65));transition:opacity .8s}
.intro.hidden{opacity:0;pointer-events:none}.intro .intro-small{font-size:12px;letter-spacing:.38em;color:#ddc28f}
.intro h2{font-size:42px;font-weight:400;letter-spacing:.14em;margin:20px 0 10px;color:#f3e4c5;text-shadow:0 3px 24px #000}
.intro p{font-size:14px;letter-spacing:.16em;color:#e0cfaa;margin:0 0 34px}
.intro button{font:19px "LXGW WenKai TC","KaiTi",serif;letter-spacing:.16em;color:#f1dfbd;background:linear-gradient(#9e4d3b,#6d2d27);border:1px solid #c79a69;padding:13px 33px;box-shadow:0 4px 0 #43231d,0 12px 25px #0008;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#e5d2aa;color:#432d20;border:1px solid #a98757;padding:10px 18px;font-size:13px;box-shadow:0 5px 24px #0006;transition:.3s;z-index:10;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}.mini-title{font-size:11px;color:#c9ad7d;letter-spacing:.22em}
.progress-label{display:flex;justify-content:space-between;color:#ad9873;font-size:11px;margin-top:9px}
@media(max-width:900px){
 .workbench{padding:0;display:block}.frame-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:min(100dvh,177.777vw);width:min(100vw,56.25dvh);max-width:100vw;margin:0;border:0;box-shadow:none}
 .side{position:absolute;z-index:4;left:10px;right:10px;bottom:10px;width:auto;max-width:none;display:grid;grid-template-columns:1fr;gap:7px;pointer-events:none}
 .brand,.scroll,.hint{display:none}.actions{pointer-events:auto;grid-template-columns:repeat(3,1fr);gap:6px}
 .ancient-btn{padding:8px 4px;font-size:13px;background:rgba(224,207,169,.92)}.ancient-btn.primary{background:rgba(130,55,43,.96)}
 .file-row{pointer-events:auto;background:rgba(30,29,25,.84);padding:6px 10px}.frame-caption{bottom:118px}
}
@media(max-width:520px){.frame-wrap{width:100vw;height:100dvh}.frame-caption .verse{font-size:20px}.intro h2{font-size:34px}}
</style>
</head>
<body>
<main class="workbench">
  <aside class="side">
    <header class="brand"><span class="seal">诗</span><span class="small">江 南 纪 行 · 诗 境 卷</span><h1>走进《滕王阁序》</h1><p>第一人称 · 秋水长天 · 八十息诗旅</p></header>
    <section class="scroll verse-card"><div class="mini-title">当前诗境 · <span id="status">诗境 01 / 六</span></div><h2 id="chapter">云销雨霁</h2><div class="verse" id="verse">云销雨霁，彩彻区明</div><div class="note" id="note">檐雨初歇，天光乍开。</div></section>
    <section class="scroll"><h2>行旅卷轴</h2><p>从檐下入阁，循石阶登临。听雨歇、看云开、随孤鹜远去，最后停在槛外长江之前。</p><div class="progress-label"><span>启程</span><span>归于长江</span></div><div style="height:3px;background:#a68b60;margin-top:8px"><div id="progress" style="height:3px;background:#8b3d30;width:0"></div></div></section>
    <section class="actions">
      <button class="ancient-btn primary wide" id="play">启卷入境</button>
      <button class="ancient-btn" id="record">录制诗境</button><button class="ancient-btn" id="roam">随行漫游</button>
      <button class="ancient-btn" id="day">昼夜流转</button><button class="ancient-btn" id="listen">试听诵读</button>
      <button class="ancient-btn" id="narrator">诵读：开</button><button class="ancient-btn" id="restart">重行此卷</button>
      <button class="ancient-btn" id="fullscreen">铺展全屏</button>
    </section>
    <label class="file-row">男声旁白音轨（MP3 / WAV）<input type="file" id="voice-file" accept="audio/*"></label>
    <label class="file-row">古琴、箫或原创配乐音轨（MP3 / WAV）<input type="file" id="music-file" accept="audio/*"></label>
    <div class="hint">自动诗境：按分镜行进。漫游：W、A、S、D 行走，鼠标转身。录制时请选择当前标签页并勾选共享音频。成片先保存为 WebM，再以剪映导出 MP4。</div>
  </aside>
  <section class="frame-wrap">
    <div id="world"></div><div class="frame-vignette"></div><div class="frame-top">滕 王 阁 序 · 江 天 一 阁</div>
    <div class="frame-caption"><div class="chapter" id="chapter-live">云销雨霁</div><div class="verse" id="verse-live">云销雨霁，彩彻区明</div><div class="note" id="note-live">檐雨初歇，天光乍开。</div></div>
    <div class="frame-progress"><span id="progress-live"></span></div>
    <div class="intro" id="intro"><div class="intro-small">王 勃 · 江 南 诗 境</div><h2>滕 王 阁 序</h2><p>云开之后，江天有一阁</p><button id="close-intro">展 卷 入 境</button></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
