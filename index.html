<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>方块世界 · 滕王阁</title>
<style>
:root{--ink:#f2f1e8;--muted:#b6c8bd;--gold:#e6c887;--glass:rgba(10,28,31,.72);--line:rgba(235,220,177,.22)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b6b2;color:var(--ink);font-family:Inter,"Microsoft YaHei",sans-serif}
#world{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:24px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.brand{pointer-events:auto}.eyebrow{font-size:10px;letter-spacing:.26em;color:var(--gold);text-transform:uppercase}.brand h1{font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:clamp(23px,3vw,38px);letter-spacing:.08em;margin:8px 0 4px}.brand p{font-size:12px;color:#e1e8d9;margin:0;letter-spacing:.1em}
.pill,.panel{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 16px 50px #102a2b30;border-radius:14px}.status{padding:11px 15px;font-size:11px;color:#d5e3d8;letter-spacing:.12em}.status b{color:#d6d28b;font-weight:500}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.info{pointer-events:auto;max-width:390px;padding:18px 20px}.info small{color:var(--gold);letter-spacing:.2em;font-size:10px}.info h2{font:500 22px Georgia,"Songti SC",serif;margin:8px 0}.info p{font-size:12px;line-height:1.8;color:#c5d4cb;margin:0}.controls{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:520px}.btn{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:11px 14px;border-radius:10px;cursor:pointer;font-size:11px;letter-spacing:.08em;backdrop-filter:blur(12px);transition:.2s}.btn:hover,.btn.active{background:#d7bd7c;color:#1c2b29;border-color:#d7bd7c}.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;color:#fff;background:#102b2bb0;padding:9px 13px;border-radius:99px;pointer-events:none;opacity:.88;transition:opacity 1s}.crosshair{position:fixed;left:50%;top:50%;width:8px;height:8px;border:1px solid #fff9;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
@media(max-width:700px){.hud{padding:15px}.status{display:none}.bottom{align-items:stretch;flex-direction:column}.info{max-width:none}.controls{justify-content:flex-start}.brand p{max-width:240px;line-height:1.6}}
</style>
</head>
<body>
<div id="world"></div>
<div class="hud">
 <div class="top"><div class="brand"><div class="eyebrow">VOXEL JIANGNAN · NANCHANG</div><h1>方块世界 · 滕王阁</h1><p>落霞与孤鹜齐飞，秋水共长天一色</p></div><div class="pill status"><b>●</b> 场景已载入　/　漫游模式</div></div>
 <div class="bottom">
  <section class="panel info"><small>LANDMARK 01 / GANJIANG RIVER</small><h2>江天一阁 · 滕王阁</h2><p>以方块积木重构江南名楼。沿江而立，层檐叠起；你可以环绕建筑、漫游江岸，在像素山水之间寻找自己的观景角度。</p></section>
  <nav class="controls"><button class="btn active" id="orbit">环绕视角</button><button class="btn" id="walk">漫游模式</button><button class="btn" id="day">昼夜切换</button><button class="btn" id="reset">重置视角</button></nav>
 </div>
</div>
<div class="hint" id="hint">拖动旋转 · 滚轮缩放 · WASD 移动</div><div class="crosshair"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const mount=document.querySelector('#world');
const scene=new THREE.Scene();scene.background=new THREE.Color('#91c2c0');scene.fog=new THREE.Fog('#91c2c0',45,115);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,250);camera.position.set(27,22,34);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;mount.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,7,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=12;controls.maxDistance=72;
scene.add(new THREE.HemisphereLight('#e6f5e6','#64766b',2.0));
const sun=new THREE.DirectionalLight('#ffe1a8',3.1);sun.position.set(-24,38,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.88});
const grass=mat('#6d9a62'),grass2=mat('#83a96b'),earth=mat('#795c43'),stone=mat('#9b9c88'),stoneDark=mat('#606f69'),water=mat('#397e83'),wood=mat('#875035'),woodLight=mat('#b87942'),red=mat('#9c3f32'),roof=mat('#354d48'),roofLight=mat('#587267'),gold=mat('#d9b76f'),leaf=mat('#477451'),leaf2=mat('#668b54');
const geo=new THREE.BoxGeometry(1,1,1);
function block(x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function slab(x,y,z,sx,sz,m=grass){return block(x,y,z,sx,.8,sz,m)}
// island and river
slab(0,-.7,0,72,58,earth);slab(0,-.15,0,70,56,grass);
block(0,-.2,-39,180,.5,30,water);block(0,-.2,39,180,.5,30,water);
for(let i=0;i<24;i++){let x=-33+i*2.8;block(x,.08,-25+Math.sin(i*.7)*1.8,1.4,.12,1.1,grass2)}
// pavilion foundation
block(0,.55,0,19,1.4,15,stoneDark);block(0,1.25,0,17.8,.6,13.8,stone);
for(let x=-8;x<=8;x+=2)for(let z=-6;z<=6;z+=2)block(x,1.65,z,.22,.45,.22,stoneDark);
// tower tiers: broad timber body, red columns, green tiled roofs, raised corners
function roofTier(y,w,d){block(0,y,0,w,.55,d,roof);block(0,y+.22,0,w*.82,.14,d*.82,roofLight);
 for(let x of [-1,1])for(let z of [-1,1]){let e=block(x*(w/2+.7),y+.38,z*(d/2+.7),1.7,.22,1.7,roofLight);e.rotation.z=x*.12;e.rotation.x=-z*.12}
 block(0,y+.62,0,.65,.38,.65,gold);
}
function floorLevel(y,w,d,h){block(0,y+h/2,0,w,h,d,wood);block(0,y+.2,0,w+.6,.25,d+.6,red);
 for(let x=-w/2+.7;x<w/2;x+=2.1)for(let z of [-d/2+.22,d/2-.22])block(x,y+h/2,z,.24,h,.24,red);
 for(let z=-d/2+.7;z<d/2;z+=2.1)for(let x of [-w/2+.22,w/2-.22])block(x,y+h/2,z,.24,h,.24,red);
 // window bays
 for(let x=-w/2+1.4;x<w/2-1;x+=2.1)block(x,y+h*.65,0,.9,.85,d+.04,woodLight);
}
floorLevel(1.9,13,10,4.2);roofTier(6.4,17,14);
floorLevel(7.2,10.5,8.5,3.6);roofTier(11.35,14,12);
floorLevel(12,8,6.5,3.1);roofTier(15.55,11.5,9.5);
floorLevel(16.2,5.5,4.8,2.5);roofTier(19.05,8.8,7.5);
block(0,20.1,0,.8,1.1,.8,gold);block(0,20.85,0,.28,.65,.28,gold);
// front steps and stone path
for(let i=0;i<7;i++)block(0,.25+i*.08,8+i*1.05,5+i*.45,.35,1.2,stone);
for(let i=0;i<8;i++)block(0,.25,15+i*1.1,3,.35,1,stone);
// pagoda side pavilion / lanterns
for(let x of [-11,11]){block(x,1.2,1,1.1,2.4,1.1,wood);block(x,2.55,1,2,.25,2,roof);block(x,2.95,1,.35,.7,.35,gold)}
// blocky trees
function tree(x,z,s=1){block(x,.7*s,z,.9*s,1.4*s,.9*s,wood);for(let j=0;j<3;j++){let size=(3.7-j*.7)*s;block(x,(2+j*1.25)*s,z,size,1.4*s,size,j%2?leaf2:leaf)}block(x,5.2*s,z,1.7*s,1.3*s,1.7*s,leaf2)}
for(const p of [[-19,-8,1.1],[-24,3,1.3],[-18,15,.9],[20,-10,1.2],[24,6,1.1],[18,17,1.3],[-29,-17,.9],[30,-19,1]])tree(...p);
// distant city silhouettes
for(let i=0;i<18;i++){let x=-34+i*4;let h=3+(i*7%8);block(x,h/2,-29,2.5,h,2,stoneDark)}
// stepping stones and shrubs
for(let i=0;i<25;i++){let x=Math.sin(i*8.1)*27,z=Math.cos(i*3.7)*22;if(Math.abs(x)>12||Math.abs(z)>12)block(x,.35,z,1.1,.5,1, i%2?grass2:stone)}
// clouds made of blocks
const clouds=[];for(let i=0;i<7;i++){let g=new THREE.Group();for(let j=0;j<5;j++){let b=new THREE.Mesh(geo,mat('#e3e8d8'));b.scale.set(2.8,1,2);b.position.set((j-2)*1.8,Math.sin(j)*.4,Math.cos(j)*.4);g.add(b)}g.position.set(-42+i*14,29+(i%3)*3,-34);scene.add(g);clouds.push(g)}
let night=false,walk=false,keys={};const original={pos:camera.position.clone(),target:controls.target.clone()};
function toggleDay(){night=!night;scene.background.set(night?'#172c3c':'#91c2c0');scene.fog.color.set(night?'#172c3c':'#91c2c0');sun.intensity=night?.55:3.1;sun.color.set(night?'#8eb8e8':'#ffe1a8');scene.children.forEach(o=>{if(o.isHemisphereLight)o.intensity=night?.65:2});document.querySelector('#day').classList.toggle('active',night)}
document.querySelector('#day').onclick=toggleDay;
document.querySelector('#reset').onclick=()=>{camera.position.copy(original.pos);controls.target.copy(original.target);controls.update();walk=false;document.querySelector('#walk').classList.remove('active');document.querySelector('#orbit').classList.add('active')};
document.querySelector('#orbit').onclick=()=>{walk=false;controls.enabled=true;document.querySelector('#walk').classList.remove('active');document.querySelector('#orbit').classList.add('active')};
document.querySelector('#walk').onclick=()=>{walk=!walk;controls.enabled=!walk;document.querySelector('#walk').classList.toggle('active',walk);document.querySelector('#orbit').classList.toggle('active',!walk)};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['w','a','s','d',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let prev=performance.now();function animate(t){requestAnimationFrame(animate);let dt=Math.min((t-prev)/1000,.04);prev=t;clouds.forEach((c,i)=>{c.position.x+=dt*(.35+i*.025);if(c.position.x>50)c.position.x=-50});if(walk){let f=(keys.w?1:0)-(keys.s?1:0),r=(keys.d?1:0)-(keys.a?1:0);let v=new THREE.Vector3(r,0,f).normalize().multiplyScalar(dt*9);camera.position.add(v);controls.target.add(v)}controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setTimeout(()=>document.querySelector('#hint').style.opacity=0,6500);
</script>
</body></html>
